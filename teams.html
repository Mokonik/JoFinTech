<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JO Fintech Festival 2026 — Public</title>
<link rel="icon" type="image/png" href="assets/jo-mark.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B1A24">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Mono:wght@600;700&family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous" defer></script>
<script src="config.js" defer></script>
<style>
  :root {
    --bg:#F2F2F7; --surface-sunken:#E8E8ED; --border-c:rgba(60,60,67,.14);
    --text:#0B1A24; --muted:#68686D; --muted-soft:#5C7079;
    --acc:#1B3B7A; --acc-ink:#ffffff; --live:#FF3B30; --jo-blue:#2F8FEF;
    --card-surface:#FFFFFF;
    --sh-sm:0 1px 2px rgba(11,26,36,.05), 0 1px 1px rgba(11,26,36,.04);
    --sh-md:0 4px 14px rgba(11,26,36,.10), 0 1px 2px rgba(11,26,36,.06);
    --sh-lg:0 16px 32px rgba(11,26,36,.14), 0 2px 6px rgba(11,26,36,.07);
    --radius-xs:9px; --radius-sm:13px; --radius-md:18px; --radius-lg:24px; --radius-pill:999px;
    --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,'SF Mono','Red Hat Mono',monospace; --brand-f:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;
    --ease-glide:cubic-bezier(.2,.8,.3,1);
    --fs-3xs:11px; --fs-2xs:12px; --fs-xs:12.5px; --fs-sm:13px; --fs-base:14px; --fs-md:15px; --fs-lg:16px; --fs-xl:17px; --fs-2xl:19px; --fs-3xl:26px;
    --wlt-card-sh: 0 14px 30px rgba(11,26,36,.32), 0 3px 8px rgba(11,26,36,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#000000; --surface-sunken:#1C1C1E; --border-c:rgba(255,255,255,.14);
      --text:#F2F2F7; --muted:#98989D; --muted-soft:#8FA1AB;
      --acc:#6C9BE8; --acc-ink:#0B1A24; --live:#FF453A; --jo-blue:#63A9F5;
      --card-surface:#1C1C1E;
      --sh-sm:0 1px 2px rgba(0,0,0,.5), 0 1px 1px rgba(0,0,0,.4);
      --sh-md:0 4px 16px rgba(0,0,0,.55);
      --sh-lg:0 18px 36px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    --bg:#000000; --surface-sunken:#1C1C1E; --border-c:rgba(255,255,255,.14);
    --text:#F2F2F7; --muted:#98989D; --muted-soft:#8FA1AB;
    --acc:#6C9BE8; --acc-ink:#0B1A24; --live:#FF453A; --jo-blue:#63A9F5;
    --card-surface:#1C1C1E;
    --sh-sm:0 1px 2px rgba(0,0,0,.5), 0 1px 1px rgba(0,0,0,.4);
    --sh-md:0 4px 16px rgba(0,0,0,.55);
    --sh-lg:0 18px 36px rgba(0,0,0,.6);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { overscroll-behavior-y:contain; overflow-x:hidden; }
  body { font-family:var(--sans); background:var(--bg); color:var(--text); line-height:1.6; position:relative; overflow-x:hidden; -webkit-font-smoothing:antialiased; }
  html[lang="ar"] body { font-family:'Cairo',-apple-system,sans-serif; }
  html[lang="ar"] { --brand-f:'Cairo',sans-serif; --mono:'Cairo','Red Hat Mono',monospace; }
  html[dir="rtl"] { direction:rtl; }
  ::selection { background:var(--acc); color:var(--acc-ink); }
  /* reduced motion = gentler, not none: loops stop, everything else becomes a short cross-fade (no hard cuts) */
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-iteration-count:1 !important; animation-duration:.2s !important; transition-duration:.18s !important; transition-delay:0s !important; } }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  :focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
  /* shared venue screen, read from across a room: the type scale steps up on big displays */
  @media (min-width:1500px) { :root { --fs-3xs:12px; --fs-2xs:13px; --fs-xs:14px; --fs-sm:15px; --fs-base:17px; --fs-md:18px; --fs-lg:19px; --fs-xl:21px; --fs-2xl:24px; } }
  .conn-badge { position:fixed; top:12px; inset-inline-end:12px; z-index:50; padding:6px 12px; border-radius:999px; font-size:var(--fs-sm); font-weight:700; background:color-mix(in srgb, var(--danger, #D9331F) 16%, var(--card-surface, #fff)); color:var(--text); box-shadow:var(--sh-md, 0 4px 14px rgba(11,26,36,.1)); opacity:0; transition:opacity .3s ease; pointer-events:none; }
  .conn-badge.show { opacity:1; }

  /* -------- ambient background: same tone-on-tone facet language as the judge app -------- */
  /* -------- persistent top strip: always visible regardless of what's rotating below -------- */
  .top-strip { position:sticky; top:0; z-index:3; display:flex; align-items:center; gap:18px; padding:14px 30px; background:color-mix(in srgb, var(--card-surface) 86%, transparent); backdrop-filter:blur(20px) saturate(1.6); -webkit-backdrop-filter:blur(20px) saturate(1.6); box-shadow:var(--sh-sm); flex-wrap:wrap; }
  /* Same trade as the judge app's header: this bar is sticky for the entire time the
     kiosk screen runs (hours, unattended), so a continuously-recomposited blur is
     real sustained cost on whatever tablet ends up running it. Plain opaque below the
     phone/small-tablet breakpoint; large fixed displays keep the frosted look. */
  @media (max-width:720px) {
    .top-strip { background:var(--card-surface); backdrop-filter:none; -webkit-backdrop-filter:none; }
  }
  .strip-brand { display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .strip-brand img { height:26px; display:block; }
  .strip-brand .name { font-family:var(--brand-f); font-weight:800; font-size:var(--fs-md); white-space:nowrap; }
  .strip-brand .name b { color:var(--jo-blue); }
  .strip-mid { flex:1; display:flex; align-items:center; justify-content:center; gap:16px; min-width:200px; flex-wrap:wrap; }
  .strip-now .idle { font-family:var(--sans); color:var(--muted); font-weight:600; font-size:var(--fs-base); }
  .strip-next { flex-shrink:0; display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:var(--fs-xs); color:var(--muted); text-transform:uppercase; letter-spacing:.6px; }
  .strip-next b { color:var(--text); text-transform:none; letter-spacing:0; font-weight:700; }
  .strip-next.hide { display:none; }
  /* the same floating live-status pill + depleting progress bar as the judge app —
     the two surfaces share one live-state language instead of two different ones. */
  .live-pill { display:inline-flex; align-items:center; gap:8px; background:#0B0B0D; color:#fff; padding:8px 14px 8px 11px; border-radius:var(--radius-pill); box-shadow:0 10px 22px -8px rgba(0,0,0,.4); }
  :root:not([data-theme="light"]) .live-pill, :root[data-theme="dark"] .live-pill { background:#1C1C1E; box-shadow:0 10px 22px -8px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.06); }
  .live-pill-dot { width:7px; height:7px; border-radius:50%; background:var(--live); flex-shrink:0; animation:pulsedot 1.8s infinite; }
  @keyframes pulsedot { 0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--live) 55%, transparent);} 70%{box-shadow:0 0 0 7px transparent;} 100%{box-shadow:0 0 0 0 transparent;} }
  .live-pill-label { font-family:var(--sans); font-size:var(--fs-sm); font-weight:600; }
  .live-pill-timer { font-family:var(--mono); font-size:var(--fs-sm); font-weight:700; font-variant-numeric:tabular-nums; color:#FF6961; padding-inline-start:8px; margin-inline-start:2px; border-inline-start:1px solid rgba(255,255,255,.22); }
  .live-pill.urgent { animation:urgentpop 1s ease-in-out infinite; }
  @keyframes urgentpop { 0%,100%{transform:scale(1);} 50%{transform:scale(1.035);} }
  /* full-width, pinned to the strip's own bottom edge — legible as a glance-from-
     across-the-room countdown the way a small in-pill bar wouldn't be. */
  .strip-progress { position:absolute; left:0; right:0; bottom:-1px; height:3px; background:transparent; overflow:hidden; }
  .strip-progress-fill { display:block; height:100%; width:100%; transform-origin:left; background:linear-gradient(90deg, var(--jo-blue), var(--live)); transition:transform 1s linear, background .4s ease; }
  .strip-progress-fill.urgent { background:var(--live); }
  @media (max-width:720px) { .top-strip { padding:12px 16px; gap:10px; } .strip-brand .name { font-size:var(--fs-sm); } .live-pill-label, .live-pill-timer { font-size:var(--fs-xs); } }

  main { position:relative; z-index:2; max-width:1080px; margin:0 auto; padding:36px 28px 60px; }

  /* -------- live team hero card -------- */
  .hero-wrap { display:flex; flex-direction:column; align-items:center; gap:20px; margin-bottom:48px; text-align:center; }
  .hero-idle { display:flex; flex-direction:column; align-items:center; gap:10px; padding:50px 20px; color:var(--muted); }
  .hero-idle img { height:44px; opacity:.5; margin-bottom:6px; }
  .hero-idle .t { font-size:var(--fs-xl); font-weight:700; color:var(--text); }
  .hero-idle .s { font-size:var(--fs-base); }

  .pv-card-row { display:flex; align-items:center; gap:36px; flex-wrap:wrap; justify-content:center; }
  .pv-card { position:relative; width:440px; max-width:88vw; height:296px; border-radius:26px; padding:24px 26px; color:#fff; overflow:hidden;
    box-shadow:var(--wlt-card-sh); display:flex; flex-direction:column; justify-content:space-between; }
  .pv-card::after { content:''; position:absolute; inset:0; pointer-events:none; border-radius:inherit;
    background-image:repeating-linear-gradient(115deg, rgba(255,255,255,.045) 0 1px, transparent 1px 4px), repeating-linear-gradient(25deg, rgba(0,0,0,.035) 0 1px, transparent 1px 5px); }
  .pv-card::before { content:''; position:absolute; inset:0; background-image:repeating-linear-gradient(115deg, rgba(255,255,255,.05) 0 1px, transparent 1px 5px); }
  .pv-card.pv-live { box-shadow:var(--wlt-card-sh), 0 20px 40px color-mix(in srgb, var(--live) 40%, transparent); }

  /* Same fix as the judge app's wallet card: the ring's masked shape stays fixed,
     only a rotating child underneath it moves — compositor-only transform instead of
     a conic-gradient repainting every frame, which matters even more here since this
     screen is meant to run continuously for hours on whatever kiosk hardware it's on. */
  .pv-ring { position:absolute; inset:2px; border-radius:24px; padding:4px; z-index:2; pointer-events:none; overflow:hidden;
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask-composite: exclude; -webkit-mask-composite: xor; }
  .pv-ring-spin { position:absolute; inset:-60%;
    background: conic-gradient(from 0deg, var(--live), color-mix(in srgb, var(--jo-blue) 65%, var(--live)) 22%, transparent 45%, transparent 72%, var(--live));
    animation: pvRingSpin 4.5s linear infinite; will-change: transform; }
  @keyframes pvRingSpin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .pv-ring-spin { animation: none; } }

  .pv-chip-float { position:absolute; left:26px; top:134px; z-index:2; }
  html[dir="rtl"] .pv-chip-float { left:auto; right:26px; }
  .pv-chip { width:42px; height:30px; border-radius:6px; position:relative; box-sizing:border-box;
    display:grid; grid-template-columns:1.3fr 1fr 1fr; grid-template-rows:1fr 1fr; gap:2px; padding:3px;
    background:linear-gradient(135deg,#F7E7B4,#D4AF37 45%,#F3DFA0 70%,#B8860B); box-shadow:0 2px 4px rgba(0,0,0,.35), inset 0 0 0 1px rgba(120,84,10,.4); }
  .pv-chip-pad { border-radius:2px; background:linear-gradient(135deg, rgba(255,255,255,.6), rgba(184,134,11,.5) 55%, rgba(0,0,0,.18)); box-shadow:inset 0 0 0 1px rgba(0,0,0,.15); }
  .pv-chip-pad:first-child { grid-row:1 / 3; }

  /* name row + LIVE NOW seal are one block pinned to the top, so the seal keeps a fixed gap under the category line instead of floating wherever space-between leaves it */
  .pv-head { position:relative; z-index:1; flex-shrink:0; display:flex; flex-direction:column; gap:8px; align-items:flex-start; }
  .pv-head .pv-top { align-self:stretch; }
  .pv-top { display:flex; align-items:center; gap:12px; position:relative; z-index:1; direction:ltr; text-align:left; }
  .pv-top-text { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .pv-name { font-size:23px; font-weight:800; letter-spacing:-.3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pv-meta { font-family:var(--mono); font-size:var(--fs-xs); letter-spacing:.5px; text-transform:uppercase; opacity:.72; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pv-mark { height:34px; opacity:.92; filter:brightness(0) invert(1); }
  .pv-seal { position:relative; z-index:1; font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:1px; background:#fff; color:var(--live); padding:6px 12px 6px 9px; border-radius:var(--radius-pill); display:inline-flex; align-items:center; gap:6px; box-shadow:0 2px 7px rgba(0,0,0,.3); align-self:flex-start; }
  .pv-seal .dot-static { width:6px; height:6px; border-radius:50%; background:var(--live); flex-shrink:0; }
  .pv-mid { flex:1; display:flex; align-items:center; justify-content:flex-end; position:relative; z-index:1; }
  .pv-shape { width:72px; height:72px; opacity:.16; }
  html[dir="rtl"] .pv-shape { transform:scaleX(-1); }
  .pv-bottom { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; position:relative; z-index:1; direction:ltr; }
  .pv-num { font-family:var(--mono); font-size:var(--fs-lg); letter-spacing:2px; opacity:.85; }
  .pv-powered { display:flex; align-items:center; gap:7px; color:rgba(255,255,255,.42); filter:drop-shadow(0 1px 0 rgba(255,255,255,.1)) drop-shadow(0 -1px 0 rgba(0,0,0,.3)); }
  .pv-powered img { height:22px; filter:brightness(0) invert(1); opacity:.78; }
  .pv-powered span { font-family:var(--mono); font-size:var(--fs-xs); font-weight:700; letter-spacing:.5px; text-transform:uppercase; }

  .pv-about { max-width:340px; text-align:start; background:var(--card-surface); box-shadow:var(--sh-sm); border-radius:var(--radius-lg); padding:22px 24px; }
  .pv-about .l { font-family:var(--mono); font-size:var(--fs-2xs); font-weight:800; letter-spacing:1.4px; text-transform:uppercase; color:var(--muted-soft); margin-bottom:8px; }
  .pv-about .v { font-size:var(--fs-md); color:var(--text); line-height:1.7; }
  .pv-about .empty { color:var(--muted); font-style:italic; }
  @media (max-width:720px) { .pv-card { height:280px; padding:20px; } .pv-name { font-size:20px; } .pv-about { max-width:88vw; } }

  /* -------- rotating content: crossfade, never a hard cut -------- */
  .rotator { position:relative; min-height:420px; }
  .rot-view { position:absolute; inset:0; opacity:0; visibility:hidden; transition:opacity .9s var(--ease-glide); pointer-events:none; }
  .rot-view.active { position:relative; opacity:1; visibility:visible; pointer-events:auto; }
  .rot-dots { display:flex; justify-content:center; gap:8px; margin-top:30px; }
  .rot-dots i { width:6px; height:6px; border-radius:50%; background:var(--border-c); transition:background .4s, transform .4s; }
  .rot-dots i.active { background:var(--jo-blue); transform:scale(1.4); }

  h2.section-h { font-family:var(--brand-f); font-weight:700; font-size:var(--fs-xl); margin-bottom:18px; text-align:center; }

  .rb-card { background:var(--card-surface); box-shadow:var(--sh-sm); border-radius:var(--radius-md); padding:16px 20px; margin-bottom:9px; display:flex; gap:16px; align-items:flex-start; }
  .rb-weight-col { flex-shrink:0; width:52px; text-align:center; }
  .rb-weight { font-family:var(--mono); font-size:var(--fs-lg); font-weight:700; color:var(--acc); }
  .rb-weight-bar { height:3px; background:var(--border-c); margin-top:7px; border-radius:2px; overflow:hidden; }
  .rb-weight-bar i { display:block; height:100%; background:var(--acc); }
  .rb-body h3 { font-size:var(--fs-lg); font-weight:700; margin-bottom:4px; }
  .rb-desc { font-size:var(--fs-base); color:var(--muted); max-width:64ch; }
  .rb-total { font-size:var(--fs-sm); color:var(--muted); margin-top:12px; text-align:center; font-family:var(--mono); }

  .empty-state { text-align:center; padding:60px 20px; color:var(--muted); }
  .team-avatar { border-radius:30%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; flex-shrink:0; font-family:var(--sans); }
  .results-section { margin-bottom:30px; }
  .winner-row { display:flex; align-items:center; gap:18px; background:radial-gradient(circle at 92% 4%, color-mix(in srgb, var(--live) 24%, transparent), transparent 58%), var(--card-surface); box-shadow:var(--sh-md); border-radius:var(--radius-lg); padding:22px 24px; margin-bottom:10px; }
  .winner-name { font-size:var(--fs-2xl); font-weight:800; }
  .winner-cat { font-size:var(--fs-sm); color:var(--muted); margin-top:2px; }
  .winner-score { font-weight:800; font-size:24px; margin-inline-start:auto; color:var(--live); font-variant-numeric:tabular-nums; }
  .rank-row { display:flex; align-items:center; gap:16px; padding:13px 18px; margin-bottom:7px; background:var(--card-surface); box-shadow:var(--sh-sm); border-radius:var(--radius-md); }
  .rank-row .rk { font-family:var(--mono); font-size:var(--fs-sm); font-weight:700; color:var(--muted); width:20px; flex-shrink:0; }
  .rank-row .nm { font-size:var(--fs-md); font-weight:700; }
  .rank-row .ct { font-size:var(--fs-xs); color:var(--muted); }
  .rank-row .sc { font-weight:800; font-size:var(--fs-lg); margin-inline-start:auto; font-variant-numeric:tabular-nums; }

  .about-card { background:var(--card-surface); box-shadow:var(--sh-sm); border-radius:var(--radius-lg); padding:24px 26px; font-size:var(--fs-md); line-height:1.85; max-width:70ch; margin:0 auto; white-space:pre-line; }
  footer.tag { position:relative; z-index:2; max-width:1080px; margin:0 auto; padding:0 28px 26px; font-family:var(--mono); font-size:var(--fs-2xs); color:var(--muted); text-align:center; }
</style>
</head>
<body>
<h1 class="sr-only">JO Fintech Festival 2026 — public dashboard</h1>


<div class="top-strip" role="banner">
  <div class="strip-brand"><img src="assets/jo-mark.png" alt=""><div class="name">JO Fintech <b>Festival 2026</b></div></div>
  <div class="strip-mid">
    <div class="strip-now" id="stripNow"></div>
  </div>
  <div class="strip-next hide" id="stripNext">Next up <b id="stripNextName"></b></div>
  <div class="strip-progress hide" id="stripProgress"><div class="strip-progress-fill" id="stripProgressFill"></div></div>
</div>

<main aria-label="Live event content">
  <div class="hero-wrap" id="heroWrap"></div>
  <div class="rotator" id="rotator">
    <section class="rot-view" data-view="rubric" id="viewRubric">
      <h2 class="section-h" id="eyebrowText">Evaluation criteria</h2>
      <div id="rubricList"></div>
    </section>
    <section class="rot-view" data-view="results" id="viewResults">
      <div id="resultsContent"></div>
    </section>
    <section class="rot-view" data-view="about" id="viewAbout">
      <div class="about-card" id="aboutContent"></div>
    </section>
  </div>
  <div class="rot-dots" id="rotDots"></div>
</main>

<footer class="tag" id="footerTag">JO Fintech Festival 2026 · public dashboard</footer>

<script src="teams.js" defer></script>

</body>
</html>
